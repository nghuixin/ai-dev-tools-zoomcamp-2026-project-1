name: site-issue-triage-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triage_prod}
      POSTGRES_DB: triage
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    image: ${PROD_IMAGE:-site-issue-triage:prod}
    build: .
    restart: unless-stopped
    ports:
      - "${PROD_PORT:-8080}:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://triage:${POSTGRES_PASSWORD:-triage_prod}@postgres:5432/triage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/studies')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data_prod:
